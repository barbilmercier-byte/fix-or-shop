# Deploys the database schema and Edge Functions to Supabase.
# Runs on every push to main that changes supabase/, or by hand from the Actions tab.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    - Project Settings > General > Project ID
#   SUPABASE_DB_PASSWORD   - the database password chosen when the project was created
#   ANTHROPIC_API_KEY      - console.anthropic.com > API keys (optional until you want diagnoses to work)
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN should start with sbp_ (create one at supabase.com/dashboard/account/tokens)"; exit 1 ;;
          esac
          if ! echo "$PROJECT_ID" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_ID should be the 20-letter Project ID from Project Settings > General"; exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Set Claude API key
        if: env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_ID"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"
